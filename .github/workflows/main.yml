name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      # IMPORTANT: No Gradle cache here because the repository
      # contains the Android project inside a ZIP.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # 6. Find ZIP or direct Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Android project..."
          echo "======================================"

          # Direct project
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "Direct Gradle project found."

            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

            exit 0
          fi

          # Find ZIP
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -print \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: No Android project or ZIP file found."
            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          # Clean extraction folder
          rm -rf "$GITHUB_WORKSPACE/_android_project"

          mkdir -p "$GITHUB_WORKSPACE/_android_project"

          # Extract ZIP
          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/_android_project"

          echo ""
          echo "ZIP extracted."
          echo ""

          # Find settings.gradle
          SETTINGS_FILE=$(find \
            "$GITHUB_WORKSPACE/_android_project" \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
            \) \
            -print \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: No Gradle settings file found inside ZIP."
            echo ""
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/_android_project" \
              -maxdepth 5 \
              -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. Show project files
      - name: Show project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 3 -type f | sort

      # 8. Make Gradle executable if wrapper exists
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "No gradlew found."
            echo "System Gradle will be used."
          fi

      # 9. Check Gradle
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew --version
          else
            gradle --version
          fi

      # 10. Clean project
      - name: Clean Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              clean
          else
            gradle \
              --no-daemon \
              clean
          fi

      # 11. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              --stacktrace \
              :app:assembleDebug

          else

            gradle \
              --no-daemon \
              --stacktrace \
              :app:assembleDebug

          fi

      # 12. Find generated APK
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          if-no-files-found: error
