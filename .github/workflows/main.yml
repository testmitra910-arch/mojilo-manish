name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -print -quit || true)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: No Gradle project or ZIP file was found."
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/_project"
          mkdir -p "$GITHUB_WORKSPACE/_project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_project"

          PROJECT_SETTINGS="$(
            find "$GITHUB_WORKSPACE/_project" \
              -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -print -quit || true
          )"

          if [[ -z "$PROJECT_SETTINGS" ]]; then
            echo "ERROR: ZIP does not contain a Gradle Android project."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")" >> "$GITHUB_ENV"
          echo "Project found: $(dirname "$PROJECT_SETTINGS")"

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version

      - name: Clean Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Generated APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: test-mitra-debug-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          if-no-files-found: error
